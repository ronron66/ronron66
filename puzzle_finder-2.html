<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Puzzle Finder</title><style>body{font-family:system-ui;background:#181818;color:#fff;padding:14px}button,label{display:block;width:100%;box-sizing:border-box;margin:9px 0;padding:13px;border:0;border-radius:10px;font-size:16px}button{background:#fff}input{display:none}video,canvas{width:100%;border-radius:10px;background:#333}video{display:none}#find{display:none}#status{padding:8px;color:#ccc}</style></head><body><h2>🧩 Puzzle Finder</h2><label style="background:#4caf50">1. Photo du puzzle terminé<input id="file" type="file" accept="image/*"></label><button id="cam">2. Ouvrir la caméra</button><video id="v" autoplay playsinline></video><button id="find">🔎 Trouver la pièce</button><div id="status">Charge la photo du puzzle.</div><canvas id="out"></canvas><script>
const file=document.querySelector('#file'),cam=document.querySelector('#cam'),v=document.querySelector('#v'),find=document.querySelector('#find'),out=document.querySelector('#out'),s=document.querySelector('#status');let img,stream;
file.onchange=()=>{let f=file.files[0];if(!f)return;img=new Image();img.onload=()=>{out.width=img.naturalWidth;out.height=img.naturalHeight;out.getContext('2d').drawImage(img,0,0);s.textContent='Photo chargée. Ouvre la caméra.'};img.src=URL.createObjectURL(f)};
cam.onclick=async()=>{if(!img)return s.textContent='Charge la photo du puzzle terminé.';try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});v.srcObject=stream;v.style.display='block';find.style.display='block';s.textContent='Place UNE pièce au centre de la caméra.'}catch(e){s.textContent='Autorise la caméra dans Chrome.'}};
find.onclick=()=>{let c=document.createElement('canvas'),w=v.videoWidth,h=v.videoHeight;c.width=w;c.height=h;c.getContext('2d').drawImage(v,0,0);let side=Math.floor(Math.min(w,h)*.42),sx=(w-side)/2,sy=(h-side)/2;let p=document.createElement('canvas');p.width=p.height=64;p.getContext('2d').drawImage(c,sx,sy,side,side,0,0,64,64);let pd=p.getContext('2d').getImageData(0,0,64,64).data,best={score:1e99,x:0,y:0,z:0},r=document.createElement('canvas');r.width=r.height=64,rc=r.getContext('2d');for(let z=Math.floor(img.naturalWidth*.06);z<=Math.floor(img.naturalWidth*.22);z+=Math.max(10,Math.floor(img.naturalWidth*.03))){let step=Math.max(10,Math.floor(z/7));for(let y=0;y<=img.naturalHeight-z;y+=step)for(let x=0;x<=img.naturalWidth-z;x+=step){rc.drawImage(img,x,y,z,z,0,0,64,64);let rd=rc.getImageData(0,0,64,64).data,d=0;for(let i=0;i<pd.length;i+=12){let a=pd[i]-rd[i],b=pd[i+1]-rd[i+1],cc=pd[i+2]-rd[i+2];d+=a*a+b*b+cc*cc}if(d<best.score)best={score:d,x,y,z}}}let ctx=out.getContext('2d');ctx.drawImage(img,0,0);let x=best.x+best.z/2,y=best.y+best.z/2;ctx.beginPath();ctx.arc(x,y,Math.max(12,best.z*.08),0,7);ctx.lineWidth=Math.max(5,best.z*.025);ctx.strokeStyle='red';ctx.stroke();ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fillStyle='red';ctx.fill();s.textContent='🔴 Position estimée. Prototype : présente la pièce bien à plat et au centre.'};
</script></body></html>
